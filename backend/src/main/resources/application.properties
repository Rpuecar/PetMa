# ===========================================
# 🐕 DogCare Backend - Configuración
# ===========================================

# Nombre de la aplicación
spring.application.name=dogcare-backend

# 🔌 Conexión a MySQL (ajusta puerto si usas 3307)
spring.datasource.url=jdbc:mysql://localhost:3307/dogcare_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 🗃️ JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 📅 Formato de fechas en JSON (ISO-8601)
spring.jackson.serialization.write-dates-as-timestamps=false

# 🌐 Puerto del servidor
server.port=8080

# 📖 Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html

# ⏱️ Timeout de conexión (evita errores si MySQL tarda en arrancar)
spring.datasource.hikari.connection-timeout=30000